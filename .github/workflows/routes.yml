# Regenerates web/src/data/routes.json (road routes drawn on the map) with an OSRM car router
# on OpenStreetMap data, rebuilds the demo (docs/) and commits both.
# Run it from the Actions tab ("Run workflow") after changing places in web/src/data/places.ts.
name: road routes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run routes
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Commit routes and demo build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/src/data/routes.json docs
          git diff --cached --quiet || { git commit -m "도로 경로 갱신 (OSRM, OpenStreetMap)"; git push; }
